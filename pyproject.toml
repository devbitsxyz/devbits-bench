[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devbits-bench"
version = "0.2.0"
description = "Practical benchmarking for local AI models and inference engines"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Devbits"}]
dependencies = []

[project.scripts]
devbits-bench = "devbits_bench.cli:entrypoint"


[tool.setuptools.packages.find]
where = ["src"]
